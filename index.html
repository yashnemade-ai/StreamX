<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREAMX </title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- AOS for Scroll Animations -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

    <!-- Universal HLS Player (No Backend Required) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        :root {
            --bg: #050505;
            --nav-bg: #000000;
            --card-bg: #0d0d0f;
            --text: #ffffff;
            --text-dim: #b3b3b3;
            --accent: #E50914;
            --border: #1a1a1a;
            --shadow: rgba(229, 9, 20, 0.4);
        }

        [data-theme="light"] {
            --bg: #f8f9fa;
            --nav-bg: #ffffff;
            --card-bg: #ffffff;
            --text: #1a1a1f;
            --text-dim: #6c757d;
            --accent: #E50914;
            --border: #e9ecef;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg); color: var(--text); overflow-x: hidden; transition: background 0.4s; }

        /* --- NAVBAR --- */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 6%; background: var(--nav-bg);
            position: fixed; width: 100%; top: 0; z-index: 1000;
            border-bottom: 2px solid var(--border);
        }
        .nav-left { display: flex; align-items: center; gap: 20px; }
        .logo { font-size: 28px; font-weight: 900; letter-spacing: -1px; cursor: pointer; }
        .logo span.red { color: var(--accent); }
        
        .nav-right { display: flex; align-items: center; gap: 20px; }

        /* --- ANIMATED SEARCH BAR --- */
        .search-box {
            background: var(--bg); border: 1px solid var(--border);
            padding: 8px 15px; border-radius: 50px; display: flex; align-items: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); width: 200px;
        }
        .search-box:focus-within {
            width: 300px; border-color: var(--accent); box-shadow: 0 0 15px var(--shadow);
        }
        .search-box input { 
            background: transparent; border: none; color: var(--text); outline: none; width: 100%; font-size: 14px; margin-left: 10px;
        }
        
        .theme-btn { font-size: 20px; cursor: pointer; color: var(--text); background: none; border: none; transition: 0.3s; }

        /* --- HERO SLIDER (TEXT RESTORED) --- */
        .slider-container {
            width: 100%; height: 75vh; margin-top: 68px; position: relative;
            overflow: hidden; background: #000;
        }
        .slider-wrapper {
            display: flex; width: 100%; height: 100%;
            transition: transform 0.8s cubic-bezier(0.45, 0, 0.55, 1);
        }
        .slide { min-width: 100%; height: 100%; position: relative; }
        .slide img { width: 100%; height: 100%; object-fit: 100% 100%; }
        
        .slide-content {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 20%, transparent 100%);
            padding: 80px 6%; z-index: 10;
        }
        .slide-content h1 { 
            font-size: clamp(35px, 6vw, 65px); 
            font-weight: 900; 
            color: #ffffff !important; 
            margin-bottom: 5px;
            letter-spacing: -1.5px;
        }
        .slide-content p { 
            font-size: 18px; 
            color: #cccccc !important; 
            margin-bottom: 30px; 
            font-weight: 400;
        }

        .btn-watch-main {
            background: var(--accent) !important;
            color: #fff !important;
            padding: 14px 35px;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-transform: uppercase;
            font-size: 16px;
            transition: 0.3s;
        }
        .btn-watch-main:hover { transform: scale(1.05); }

        .slider-dots {
            position: absolute; bottom: 25px; width: 100%;
            display: flex; justify-content: center; gap: 10px; z-index: 20;
        }
        .dot { width: 10px; height: 10px; background: rgba(255,255,255,0.3); border-radius: 50%; cursor: pointer; transition: 0.4s; }
        .dot.active { background: var(--accent); width: 25px; border-radius: 10px; }

        /* --- FILTERS & GRID --- */
        .filter-container { padding: 35px 6% 0; display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; }
        .filter-chip {
            padding: 10px 25px; background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap; transition: 0.3s;
        }
        .filter-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        .container { padding: 30px 6% 100px; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 25px; }
        .movie-card { 
            background: var(--card-bg); border-radius: 12px; overflow: hidden; 
            border: 1px solid var(--border); transition: 0.4s; cursor: pointer;
        }
        .movie-card:hover { transform: translateY(-10px); border-color: var(--accent); box-shadow: 0 10px 20px var(--shadow); }
        .movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .card-info { padding: 15px; }
        .card-genre { font-size: 10px; color: var(--accent); font-weight: 800; text-transform: uppercase; margin-bottom: 5px; display: block; }
        
        .quality-tag { 
            background: var(--accent); color: white; font-size: 9px; 
            font-weight: 900; padding: 2px 8px; border-radius: 4px; display: inline-block;
            margin-top: 8px; text-transform: uppercase;
        }

        /* SIDEBAR */
        .sidebar {
            position: fixed; top: 0; left: -320px; width: 300px; height: 100%;
            background: var(--nav-bg); z-index: 2000; border-right: 1px solid var(--border);
            padding: 40px 30px; transition: 0.5s;
        }
        .sidebar.open { left: 0; }
        .sidebar-close { position: absolute; top: 25px; right: 25px; font-size: 24px; cursor: pointer; }

        /* --- PLAYER MODAL --- */
        .player-modal { position: fixed; inset: 0; background: #000; display: none; z-index: 3000; }
        
        .player-overlay { 
            position: absolute; inset: 0; z-index: 3100; 
            pointer-events: none; opacity: 0; transition: 0.4s ease;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 20%, transparent 80%, rgba(0,0,0,0.6) 100%);
        }
        .player-overlay.show { opacity: 1; }

        .player-logo-overlay {
            position: absolute; top: 25px; left: 25px; font-size: 22px; font-weight: 900; color: white;
            pointer-events: auto;
        }

        .close-player { 
            position: absolute; top: 20px; right: 25px; color: white; font-size: 35px; 
            cursor: pointer; z-index: 3500; pointer-events: auto;
        }

        .settings-container {
            position: absolute; bottom: 85px; right: 25px; 
            display: flex; flex-direction: column; align-items: flex-end;
            pointer-events: auto;
        }
        .settings-icon-btn {
            width: 45px; height: 45px; background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center;
            font-size: 20px; cursor: pointer; transition: 0.3s;
        }
        .settings-icon-btn:hover { background: var(--accent); }

        .settings-menu {
            background: rgba(13, 13, 15, 0.98); border: 1px solid var(--border);
            padding: 15px; border-radius: 12px; margin-bottom: 15px; width: 220px;
            display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .settings-menu.open { display: block; }
        .menu-item { margin-bottom: 12px; }
        .menu-item label { display: block; font-size: 10px; color: var(--text-dim); text-transform: uppercase; font-weight: 800; margin-bottom: 6px; }
        .menu-item select {
            width: 100%; background: #1a1a1a; color: white; border: 1px solid #333;
            padding: 8px; border-radius: 6px; font-size: 13px; outline: none; cursor: pointer;
        }

        @media (max-width: 768px) {
            .search-box { width: 140px; }
            .search-box:focus-within { width: 180px; }
            .slider-container { height: 50vh; }
            .slide-content { padding: 40px 6%; }
            .settings-container { bottom: 100px; right: 15px; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-left">
            <i class="fa-solid fa-bars-staggered" style="cursor:pointer; font-size:20px" onclick="toggleSidebar()"></i>
            <div class="logo" onclick="location.reload()"><span class="red">STREAM</span><span class="white">X</span></div>
        </div>
        <div class="nav-right">
            <div class="search-box">
                <i class="fa fa-search" style="opacity:0.6; font-size:14px"></i>
                <input type="text" id="searchInput" placeholder="Search movies..." oninput="searchMovies()">
            </div>
            <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </nav>

    <div class="sidebar" id="sidebar">
        <i class="fa fa-times sidebar-close" onclick="toggleSidebar()"></i>
        <div class="logo" style="margin-bottom:40px"><span class="red">STREAM</span><span class="white">X</span></div>
        <div style="font-size:14px; color:var(--text-dim); line-height:2">
            <p style="color:var(--text); font-weight:800; font-size:16px; margin-bottom:10px">Yash's StreamX</p>
            <p>Premium Movie Hub</p>
            <p>Contact: <a href="mailto:support@streamx.com" style="color:var(--accent); text-decoration:none; font-weight:700;">support@streamx.com</a></p>
            <hr style="margin:20px 0; opacity:0.1">
            <p>© 2026 All Rights Reserved.</p>
        </div>
    </div>

    <section class="slider-container">
        <div class="slider-wrapper" id="sliderWrapper"></div>
        <div class="slider-dots" id="sliderDots"></div>
    </section>

    <div class="filter-container" id="filterWrapper">
        <div class="filter-chip active" onclick="filterData('All', this)">All Content</div>
    </div>

    <div class="container">
        <div class="movie-grid" id="movieGrid" data-aos="fade-up"></div>
    </div>

    <div class="player-modal" id="playerModal">
        <div class="player-overlay" id="playerOverlay">
            <div class="player-logo-overlay">STREAM<span style="color:var(--accent)">X</span></div>
            <span class="close-player" onclick="closePlayer()">&times;</span>
            
            <div class="settings-container">
                <div class="settings-menu" id="settingsMenu">
                    <div class="menu-item">
                        <label><i class="fa fa-globe"></i> Audio Track</label>
                        <select id="audioSel" onchange="changeAudio()"><option>Default</option></select>
                    </div>
                    <div class="menu-item">
                        <label><i class="fa fa-layer-group"></i> Video Quality</label>
                        <select id="qualitySel" onchange="changeQuality()"><option>Auto</option></select>
                    </div>
                </div>
                <div class="settings-icon-btn" onclick="toggleSettingsMenu()">
                    <i class="fa fa-cog"></i>
                </div>
            </div>
        </div>
        <video id="v-player" style="width:100%; height:100vh; cursor: pointer;" autoplay controls playsinline></video>
    </div>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 800 });

        let allMovies = [], heroItems = [], gridItems = [], currentIndex = 0;
        let hlsInstance = null;
        let uiTimer;

        async function init() {
            try {
                const res = await fetch("https://api.npoint.io/56fc751c2191cd12b672");
                allMovies = await res.json();
                heroItems = allMovies.filter(m => !m.cat || m.cat.trim() === "");
                gridItems = allMovies.filter(m => m.cat && m.cat.trim() !== "");

                renderSlider();
                renderFilters();
                renderGrid(gridItems);
                startAutoSlide();
                
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                document.getElementById('themeBtn').innerHTML = isDark ? '<i class="fa-solid fa-moon"></i>' : '<i class="fa-solid fa-sun"></i>';
            } catch (e) { console.error("Load Error"); }
        }

        // --- RESTORED SLIDER CONTENT ---
        function renderSlider() {
            const wrapper = document.getElementById('sliderWrapper');
            const dots = document.getElementById('sliderDots');
            wrapper.innerHTML = heroItems.map(m => `
                <div class="slide">
                    <img src="${m.logo}">
                    <div class="slide-content">
                        <h1>${m.name}</h1>
                        <p>Platinum Exclusive • Trending</p>
                        <button class="btn-watch-main" onclick="openPlayer('${m.url}')">
                           <i class="fa fa-play"></i> WATCH NOW
                        </button>
                    </div>
                </div>`).join('');
            dots.innerHTML = heroItems.map((_, i) => `<div class="dot ${i === 0 ? 'active' : ''}" onclick="goToSlide(${i})"></div>`).join('');
        }

        function goToSlide(index) {
            currentIndex = index;
            const wrapper = document.getElementById('sliderWrapper');
            const dots = document.querySelectorAll('.dot');
            if(wrapper) wrapper.style.transform = `translateX(-${currentIndex * 100}%)`;
            dots.forEach((d, i) => d.classList.toggle('active', i === currentIndex));
        }

        function startAutoSlide() { setInterval(() => { currentIndex = (currentIndex + 1) % heroItems.length; goToSlide(currentIndex); }, 7000); }
        
        function renderGrid(data) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = data.map(m => `
                <div class="movie-card" onclick="openPlayer('${m.url}')">
                    <img src="${m.logo}" loading="lazy">
                    <div class="card-info">
                        <span class="card-genre">${m.cat || 'General'}</span>
                        <h4 style="font-size:13px; font-weight:700">${m.name}</h4>
                        <div class="quality-tag">${m.quality || 'Web-HQ'}</div>
                    </div>
                </div>`).join('');
        }

        function renderFilters() {
            const wrapper = document.getElementById('filterWrapper');
            const cats = [...new Set(gridItems.map(m => m.cat))];
            cats.forEach(c => wrapper.innerHTML += `<div class="filter-chip" onclick="filterData('${c}', this)">${c}</div>`);
        }
        function filterData(cat, el) {
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            renderGrid(cat === 'All' ? gridItems : gridItems.filter(m => m.cat === cat));
        }
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            html.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('themeBtn').innerHTML = isDark ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
        }
        function searchMovies() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            renderGrid(gridItems.filter(m => m.name.toLowerCase().includes(term)));
        }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

        const modal = document.getElementById('playerModal');
        const overlay = document.getElementById('playerOverlay');
        const video = document.getElementById('v-player');

        function showUI() {
            overlay.classList.add('show');
            clearTimeout(uiTimer);
            uiTimer = setTimeout(() => {
                if(!document.getElementById('settingsMenu').classList.contains('open')) {
                    overlay.classList.remove('show');
                }
            }, 3000);
        }

        modal.addEventListener('mousemove', showUI);
        modal.addEventListener('touchstart', showUI);

        function openPlayer(url) {
            if(!url) return;
            modal.style.display = 'block';
            showUI();

            if (Hls.isSupported() && url.includes('.m3u8')) {
                if (hlsInstance) hlsInstance.destroy();
                hlsInstance = new Hls();
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    setupQuality();
                    setupAudio();
                    video.play();
                });
            } else {
                video.src = url;
                video.play();
                document.querySelector('.settings-container').style.display = 'none';
            }
        }

        function setupQuality() {
            const sel = document.getElementById('qualitySel');
            sel.innerHTML = `<option value="-1">Auto Quality</option>`;
            hlsInstance.levels.forEach((level, index) => {
                sel.innerHTML += `<option value="${index}">${level.height}p</option>`;
            });
        }

        function setupAudio() {
            const sel = document.getElementById('audioSel');
            sel.innerHTML = '';
            if(hlsInstance.audioTracks.length > 1) {
                hlsInstance.audioTracks.forEach((track, index) => {
                    sel.innerHTML += `<option value="${index}">${track.name || track.lang}</option>`;
                });
            } else { sel.innerHTML = '<option>Original Audio</option>'; }
        }

        function changeQuality() { hlsInstance.currentLevel = parseInt(document.getElementById('qualitySel').value); }
        function changeAudio() { hlsInstance.audioTrack = parseInt(document.getElementById('audioSel').value); }
        function toggleSettingsMenu() { document.getElementById('settingsMenu').classList.toggle('open'); }

        function closePlayer() {
            video.pause();
            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            video.src = "";
            document.getElementById('settingsMenu').classList.remove('open');
            modal.style.display = 'none';
        }

        init();
    </script>
</body>
</html>
