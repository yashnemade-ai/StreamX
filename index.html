<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREAMX | Premium Experience</title>
    
    <!-- Fonts: Outfit for a modern pro look -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Video.js -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1.0.1/dist/city/index.css" rel="stylesheet">

    <style>
        :root {
            --bg: #050505;
            --nav-bg: rgba(5, 5, 5, 0.7);
            --card-bg: #111114;
            --text: #ffffff;
            --text-dim: #b3b3b3;
            --accent: #E50914;
            --border: rgba(255, 255, 255, 0.08);
        }

        [data-theme="light"] {
            --bg: #f8f9fa;
            --nav-bg: rgba(248, 249, 250, 0.8);
            --card-bg: #ffffff;
            --text: #1a1a1f;
            --text-dim: #6c757d;
            --accent: #E50914;
            --border: rgba(0, 0, 0, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg); color: var(--text); overflow-x: hidden; transition: background 0.3s; }

        /* --- NAVBAR --- */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 6%; background: var(--nav-bg);
            backdrop-filter: blur(25px); position: fixed; width: 100%; top: 0; z-index: 1000;
            border-bottom: 1px solid var(--border);
        }
        .nav-left { display: flex; align-items: center; gap: 25px; }
        .hamburger { font-size: 22px; cursor: pointer; color: var(--text); opacity: 0.8; }
        
        .logo { font-size: 30px; font-weight: 900; letter-spacing: -1px; cursor: pointer; }
        .logo span.red { color: var(--accent); }
        .logo span.white { color: var(--text); }

        .nav-right { display: flex; align-items: center; gap: 15px; }
        .search-box {
            background: rgba(128,128,128,0.1); border: 1px solid var(--border);
            padding: 7px 15px; border-radius: 12px; display: flex; align-items: center;
        }
        .search-box input { background: transparent; border: none; color: var(--text); outline: none; margin-left: 10px; width: 180px; font-size: 14px; }
        
        .theme-btn { font-size: 18px; cursor: pointer; color: var(--text); background: none; border: none; padding: 5px; }

        /* --- SIDEBAR --- */
        .sidebar {
            position: fixed; top: 0; left: -320px; width: 300px; height: 100%;
            background: var(--bg); z-index: 2000; border-right: 1px solid var(--border);
            padding: 40px 30px; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar.open { left: 0; }
        .sidebar-close { position: absolute; top: 20px; right: 25px; font-size: 28px; cursor: pointer; opacity: 0.5; }
        .sidebar h2 { margin-bottom: 20px; font-weight: 800; font-size: 22px; }
        .sidebar-info p { margin-bottom: 12px; font-size: 14px; color: var(--text-dim); }
        .sidebar-info a { color: var(--accent); text-decoration: none; font-weight: 600; }
        .sidebar-info a:hover { text-decoration: underline; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1500; display: none; backdrop-filter: blur(4px); }

        /* --- HERO SLIDESHOW --- */
        .hero {
            height: 80vh; width: 100%; position: relative; display: flex; 
            align-items: flex-end; padding: 0 6% 60px; background-size: cover; background-position: center;
            transition: background-image 1s ease-in-out;
        }
        /* Very subtle bottom-up gradient for text visibility */
        .hero::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 40%);
        }
        .hero-content { position: relative; z-index: 10; max-width: 600px; }
        .hero-content h1 { font-size: clamp(30px, 5vw, 48px); font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; }
        .hero-content p { color: #e0e0e0; margin-bottom: 20px; font-size: 16px; font-weight: 400; opacity: 0.9; }
        
        .btn-play {
            background: var(--accent); color: white; padding: 12px 35px; border: none;
            border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 15px;
            display: inline-flex; align-items: center; gap: 10px;
        }

        /* --- CATEGORY FILTERS --- */
        .filter-wrapper { 
            padding: 30px 6% 10px; display: flex; gap: 10px; 
            overflow-x: auto; scrollbar-width: none;
        }
        .filter-wrapper::-webkit-scrollbar { display: none; }
        .filter-chip {
            padding: 8px 22px; background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 50px; cursor: pointer; font-size: 14px; font-weight: 600; 
            white-space: nowrap; transition: 0.3s;
        }
        .filter-chip.active { background: var(--accent); color: white; border-color: var(--accent); }

        /* --- MOVIE GRID --- */
        .container { padding: 20px 6% 80px; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        .movie-card { 
            background: var(--card-bg); border-radius: 14px; overflow: hidden; 
            cursor: pointer; border: 1px solid var(--border); transition: 0.3s;
        }
        .movie-card:hover { transform: scale(1.03); border-color: var(--accent); }
        .movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .movie-card h4 { padding: 12px; font-size: 13px; font-weight: 600; text-align: center; }

        /* --- MODAL PLAYER --- */
        .player-modal {
            position: fixed; inset: 0; background: #000;
            display: none; justify-content: center; align-items: center; z-index: 3000;
        }
        .close-player { position: absolute; top: 20px; right: 25px; color: white; font-size: 35px; cursor: pointer; z-index: 3100; }

        @media (max-width: 768px) {
            .search-box { display: none; }
            .hero { height: 55vh; padding-bottom: 40px; }
            .hero-content h1 { font-size: 32px; }
            .movie-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
        }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <span class="sidebar-close" onclick="toggleSidebar()">&times;</span>
        <div class="logo" style="margin-bottom: 40px;"><span class="red">STREAM</span><span class="white">X</span></div>
        <div class="sidebar-info">
            <h2>Information</h2>
            <p><b>Developer:</b> Yash</p>
            <p><b>Platform:</b> StreamX Platinum</p>
            <p><b>Support Email:</b> <br>
               <a href="mailto:support@streamx.com?subject=Customer Support - StreamX">support@streamx.com</a>
            </p>
            <p style="margin-top: 20px; opacity: 0.6; font-size: 13px;">© 2026 StreamX All rights reserved.</p>
        </div>
    </div>

    <!-- HEADER -->
    <nav id="navbar">
        <div class="nav-left">
            <i class="fa-solid fa-bars-staggered hamburger" onclick="toggleSidebar()"></i>
            <div class="logo" onclick="location.reload()">
                <span class="red">STREAM</span><span class="white">X</span>
            </div>
        </div>
        <div class="nav-right">
            <div class="search-box">
                <i class="fa fa-search" style="opacity: 0.5;"></i>
                <input type="text" id="searchInput" placeholder="Search..." oninput="searchMovies()">
            </div>
            <button class="theme-btn" id="themeToggle" onclick="toggleTheme()">
                <i class="fa fa-moon"></i>
            </button>
        </div>
    </nav>

    <!-- HERO SLIDESHOW -->
    <section class="hero" id="hero">
        <div class="hero-content" id="heroContent">
            <h1 id="heroTitle">Connecting...</h1>
            <p id="heroDesc">The future of premium cinema is here.</p>
            <button class="btn-play" id="heroPlayBtn"><i class="fa fa-play"></i> Watch Now</button>
        </div>
    </section>

    <!-- FILTERS -->
    <div class="filter-wrapper" id="filterWrapper">
        <div class="filter-chip active" onclick="applyFilter('All', this)">All Content</div>
    </div>

    <!-- MAIN GRID -->
    <div class="container">
        <div class="movie-grid" id="movieGrid"></div>
    </div>

    <!-- PLAYER -->
    <div class="player-modal" id="playerModal">
        <span class="close-player" onclick="closePlayer()">&times;</span>
        <video id="v-player" class="video-js vjs-theme-city vjs-big-play-centered" controls preload="auto" style="width: 100%; height: 100vh;"></video>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
        let allMovies = [], heroItems = [], gridItems = [], currentSlide = 0;
        const vPlayer = videojs('v-player');

        const JSON_URL = "https://api.npoint.io/56fc751c2191cd12b672"; 

        async function fetchData() {
            try {
                const res = await fetch(JSON_URL);
                allMovies = await res.json();
                
                heroItems = allMovies.filter(m => !m.cat || m.cat === "");
                gridItems = allMovies.filter(m => m.cat && m.cat !== "");

                setupFilters();
                startSlideshow();
                renderGrid(gridItems);
            } catch (e) { console.error("API Error"); }
        }

        // --- SLIDESHOW ---
        function startSlideshow() {
            if(heroItems.length === 0) return;
            updateHero(heroItems[0]);
            setInterval(() => {
                currentSlide = (currentSlide + 1) % heroItems.length;
                updateHero(heroItems[currentSlide]);
            }, 8000);
        }

        function updateHero(m) {
            const hero = document.getElementById('hero');
            const content = document.getElementById('heroContent');
            content.style.opacity = 0;
            setTimeout(() => {
                hero.style.backgroundImage = `url('${m.logo}')`;
                document.getElementById('heroTitle').innerText = m.name;
                document.getElementById('heroPlayBtn').onclick = () => openPlayer(m.url);
                content.style.opacity = 1;
            }, 600);
        }

        // --- FILTERS ---
        function setupFilters() {
            const wrapper = document.getElementById('filterWrapper');
            const categories = [...new Set(gridItems.map(m => m.cat))];
            categories.forEach(cat => {
                wrapper.innerHTML += `<div class="filter-chip" onclick="applyFilter('${cat}', this)">${cat}</div>`;
            });
        }

        function applyFilter(cat, el) {
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            const filtered = cat === 'All' ? gridItems : gridItems.filter(m => m.cat === cat);
            renderGrid(filtered);
        }

        // --- GRID ---
        function renderGrid(data) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = data.map(m => `
                <div class="movie-card" onclick="openPlayer('${m.url}')">
                    <img src="${m.logo}" loading="lazy">
                    <h4>${m.name}</h4>
                </div>
            `).join('');
        }

        // --- UI ---
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').style.display = 
                document.getElementById('sidebar').classList.contains('open') ? 'block' : 'none';
        }

        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            html.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('themeToggle').innerHTML = isDark ? '<i class="fa fa-sun"></i>' : '<i class="fa fa-moon"></i>';
        }

        function searchMovies() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            renderGrid(gridItems.filter(m => m.name.toLowerCase().includes(term)));
        }

        function openPlayer(url) {
            document.getElementById('playerModal').style.display = 'flex';
            let type = 'application/x-mpegURL';
            if(url.includes('.mp4')) type = 'video/mp4';
            if(url.includes('.mpd')) type = 'application/dash+xml';
            vPlayer.src({ src: url, type: type });
            vPlayer.play();
        }

        function closePlayer() {
            vPlayer.pause();
            document.getElementById('playerModal').style.display = 'none';
        }

        fetchData();
    </script>
</body>
</html>
