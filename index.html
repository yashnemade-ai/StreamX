<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREAMX </title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Video.js -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <!-- AOS for Scroll Animations -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

    <style>
        :root {
            --bg: #050505;
            --nav-bg: #000000;
            --card-bg: #0d0d0f;
            --text: #ffffff;
            --text-dim: #b3b3b3;
            --accent: #E50914;
            --border: #1a1a1a;
            --shadow: rgba(229, 9, 20, 0.2);
        }

        [data-theme="light"] {
            --bg: #f8f9fa;
            --nav-bg: #ffffff;
            --card-bg: #ffffff;
            --text: #1a1a1f;
            --text-dim: #6c757d;
            --accent: #E50914;
            --border: #e9ecef;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg); color: var(--text); overflow-x: hidden; transition: background 0.4s; }

        /* --- NAVBAR --- */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 6%; background: var(--nav-bg);
            position: fixed; width: 100%; top: 0; z-index: 1000;
            border-bottom: 2px solid var(--border);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .nav-left { display: flex; align-items: center; gap: 20px; }
        .logo { font-size: 28px; font-weight: 900; letter-spacing: -1px; cursor: pointer; }
        .logo span.red { color: var(--accent); }
        
        .nav-right { display: flex; align-items: center; gap: 20px; }
        .search-box {
            background: var(--bg); border: 2px solid var(--border);
            padding: 8px 15px; border-radius: 10px; display: flex; align-items: center;
        }
        .search-box input { background: transparent; border: none; color: var(--text); outline: none; width: 180px; font-size: 14px; font-weight: 500; }
        
        /* THEME BUTTON ANIMATION */
        .theme-btn { 
            font-size: 22px; cursor: pointer; color: var(--text); 
            background: none; border: none; display: flex; align-items: center;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .theme-btn:active { transform: rotate(180deg) scale(1.2); }

        /* --- HERO SLIDER (ONE AT A TIME) --- */
        .slider-container {
            width: 100%; height: 75vh; margin-top: 68px; position: relative;
            overflow: hidden; background: #000;
        }
        .slider-wrapper {
            display: flex; width: 100%; height: 100%;
            transition: transform 0.8s cubic-bezier(0.45, 0, 0.55, 1);
        }
        .slide { min-width: 100%; height: 100%; position: relative; }
        .slide img { width: 100%; height: 100%; object-fit: 100% 100%; }
        
        .slide-content {
            position: absolute; bottom: 60px; left: 6%; z-index: 10;
            text-align: left; max-width: 600px;
            animation: slideIn 1s ease;
        }
        @keyframes slideIn { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }

        .slide-content h1 { font-size: clamp(30px, 5vw, 55px); font-weight: 900; margin-bottom: 5px; text-shadow: 2px 2px 15px rgba(0,0,0,0.9); }
        .slide-content p { font-size: 18px; color: #eee; margin-bottom: 25px; opacity: 0.8; }

        .slider-dots {
            position: absolute; bottom: 25px; width: 100%;
            display: flex; justify-content: center; gap: 10px; z-index: 20;
        }
        .dot { width: 10px; height: 10px; background: rgba(255,255,255,0.3); border-radius: 50%; cursor: pointer; transition: 0.4s; }
        .dot.active { background: var(--accent); width: 25px; border-radius: 10px; }

        /* --- CATEGORIES & ANIMATION --- */
        .filter-container { padding: 35px 6% 0; display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; }
        .filter-chip {
            padding: 10px 28px; background: var(--card-bg); border: 2px solid var(--border);
            border-radius: 8px; cursor: pointer; font-weight: 700; white-space: nowrap; transition: 0.3s;
        }
        .filter-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); transform: scale(1.05); }

        /* Grid transition effect */
        .grid-anim { animation: gridFade 0.5s ease; }
        @keyframes gridFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- CARDS --- */
        .container { padding: 30px 6% 100px; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 25px; }
        
        .movie-card { 
            background: var(--card-bg); border-radius: 12px; overflow: hidden; 
            border: 2px solid var(--border); transition: 0.4s; cursor: pointer;
            position: relative;
        }
        .movie-card:hover { 
            transform: translateY(-12px); 
            border-color: var(--accent);
            box-shadow: 0 10px 25px var(--shadow);
        }
        .movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        
        .card-info { padding: 15px; }
        .card-info h4 { font-size: 14px; font-weight: 800; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-genre { font-size: 11px; color: var(--accent); font-weight: 800; text-transform: uppercase; margin-bottom: 8px; display: block; }
        .quality-tag { 
            background: var(--accent); color: white; font-size: 9px; 
            font-weight: 900; padding: 2px 8px; border-radius: 4px; display: inline-block;
        }

        /* SIDEBAR */
        .sidebar {
            position: fixed; top: 0; left: -320px; width: 300px; height: 100%;
            background: var(--nav-bg); z-index: 2000; border-right: 2px solid var(--border);
            padding: 40px 30px; transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar.open { left: 0; }
        .sidebar-close { position: absolute; top: 25px; right: 25px; font-size: 28px; cursor: pointer; }

        /* PLAYER */
        .player-modal { position: fixed; inset: 0; background: #000; display: none; z-index: 3000; }
        .close-player { position: absolute; top: 20px; right: 25px; color: white; font-size: 40px; cursor: pointer; z-index: 3100; }

        @media (max-width: 768px) {
            .search-box { display: none; }
            .slider-container { height: 50vh; }
            .movie-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-left">
            <i class="fa-solid fa-bars-staggered" style="cursor:pointer; font-size:20px" onclick="toggleSidebar()"></i>
            <div class="logo" onclick="location.reload()"><span class="red">STREAM</span><span class="white">X</span></div>
        </div>
        <div class="nav-right">
            <div class="search-box">
                <i class="fa fa-search" style="opacity:0.5"></i>
                <input type="text" id="searchInput" placeholder="Search..." oninput="searchMovies()">
            </div>
            <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </nav>

    

    <section class="slider-container">
        <div class="slider-wrapper" id="sliderWrapper"></div>
        <div class="slider-dots" id="sliderDots"></div>
    </section>

    <div class="filter-container" id="filterWrapper">
        <div class="filter-chip active" onclick="filterData('All', this)">All Content</div>
    </div><!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <i class="fa fa-times sidebar-close" onclick="toggleSidebar()"></i>
        <div class="logo" style="margin-bottom:40px"><span class="red">STREAM</span><span class="white">X</span></div>
        <div style="font-size:15px; color:var(--text-dim); line-height:1.8">
            <p style="color:var(--text); font-weight:900; font-size:18px; margin-bottom:10px">ABOUT INFO</p>
            <p>Developed by: <b>Yash</b></p>
            <p>Support: <a href="mailto:support@streamx.com" style="color:var(--accent); text-decoration:none">support@streamx.com</a></p>
            <hr style="margin:20px 0; opacity:0.1">
            <p style="margin-top: 20px; font-size: 12px; opacity: 0.5;">© 2026 STREAMX. All rights reserved.</p>
        </div>
    </div>


    <div class="container">
        <div class="movie-grid" id="movieGrid" data-aos="fade-up"></div>
    </div>

    <div class="player-modal" id="playerModal">
        <span class="close-player" onclick="closePlayer()">&times;</span>
        <video id="v-player" class="video-js vjs-big-play-centered" controls preload="auto" style="width:100%; height:100vh;"></video>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 800 });

        let allMovies = [], heroItems = [], gridItems = [], currentIndex = 0;
        const vPlayer = videojs('v-player');

        async function init() {
            try {
                const res = await fetch("https://api.npoint.io/56fc751c2191cd12b672");
                allMovies = await res.json();
                heroItems = allMovies.filter(m => !m.cat || m.cat === "");
                gridItems = allMovies.filter(m => m.cat && m.cat !== "");

                renderSlider();
                renderFilters();
                renderGrid(gridItems);
                startAutoSlide();
                
                // Set initial theme icon
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                document.getElementById('themeBtn').innerHTML = isDark ? '<i class="fa-solid fa-moon"></i>' : '<i class="fa-solid fa-sun"></i>';
            } catch (e) { console.error("Load Error"); }
        }

        function renderSlider() {
            const wrapper = document.getElementById('sliderWrapper');
            const dots = document.getElementById('sliderDots');
            wrapper.innerHTML = heroItems.map(m => `
                <div class="slide">
                    <img src="${m.logo}">
                    <div class="slide-content">
                        <h1>${m.name}</h1>
                        <p>Platinum Exclusive • ${m.genre || 'Trending'}</p>
                        <button class="filter-chip active" style="border:none" onclick="openPlayer('${m.url}')">
                           <i class="fa fa-play"></i> &nbsp; Watch Now
                        </button>
                    </div>
                </div>`).join('');
            dots.innerHTML = heroItems.map((_, i) => `<div class="dot ${i === 0 ? 'active' : ''}" onclick="goToSlide(${i})"></div>`).join('');
        }

        function goToSlide(index) {
            currentIndex = index;
            const wrapper = document.getElementById('sliderWrapper');
            const dots = document.querySelectorAll('.dot');
            wrapper.style.transform = `translateX(-${currentIndex * 100}%)`;
            dots.forEach((d, i) => d.classList.toggle('active', i === currentIndex));
        }

        function startAutoSlide() { setInterval(() => { currentIndex = (currentIndex + 1) % heroItems.length; goToSlide(currentIndex); }, 7000); }

        function renderGrid(data) {
            const grid = document.getElementById('movieGrid');
            grid.classList.remove('grid-anim');
            void grid.offsetWidth; // Trigger reflow
            grid.classList.add('grid-anim');
            
            grid.innerHTML = data.map(m => `
                <div class="movie-card" onclick="openPlayer('${m.url}')">
                    <img src="${m.logo}" loading="lazy">
                    <div class="card-info">
                        <span class="card-genre">${m.cat || 'General'}</span>
                        <h4>${m.name}</h4>
                        <div class="quality-tag">${m.quality || 'HD'}</div>
                    </div>
                </div>`).join('');
        }

        function renderFilters() {
            const wrapper = document.getElementById('filterWrapper');
            const cats = [...new Set(gridItems.map(m => m.cat))];
            cats.forEach(c => wrapper.innerHTML += `<div class="filter-chip" onclick="filterData('${c}', this)">${c}</div>`);
        }

        function filterData(cat, el) {
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            const filtered = cat === 'All' ? gridItems : gridItems.filter(m => m.cat === cat);
            renderGrid(filtered);
        }

        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            document.getElementById('themeBtn').innerHTML = isDark ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
        }

        function searchMovies() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            renderGrid(gridItems.filter(m => m.name.toLowerCase().includes(term)));
        }

        function openPlayer(url) {
            document.getElementById('playerModal').style.display = 'flex';
            vPlayer.src({ src: url, type: 'application/x-mpegURL' });
            vPlayer.play();
        }

        function closePlayer() { vPlayer.pause(); document.getElementById('playerModal').style.display = 'none'; }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

        init();
    </script>
</body>
</html>
