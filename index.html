<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREAM PRO | Watch Movies & Series</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Video.js CSS for M3U8 support -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1.0.1/dist/city/index.css" rel="stylesheet">

    <style>
        :root {
            --bg: #050505;
            --card-bg: #121212;
            --accent: #E50914; /* Netflix Red */
            --text: #ffffff;
            --text-dim: #b3b3b3;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg); color: var(--text); overflow-x: hidden; }

        /* --- NAVBAR --- */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            position: fixed; width: 100%; top: 0; z-index: 1000; transition: 0.4s;
        }
        nav.scrolled { background: #000; border-bottom: 1px solid #222; }
        .logo { font-size: 28px; font-weight: 800; color: var(--accent); letter-spacing: -1px; }
        .search-box {
            background: rgba(255,255,255,0.1); border: 1px solid #333;
            padding: 8px 15px; border-radius: 20px; display: flex; align-items: center;
        }
        .search-box input {
            background: transparent; border: none; color: white; outline: none; margin-left: 10px; width: 200px;
        }

        /* --- HERO BANNER --- */
        .hero {
            height: 80vh; position: relative; display: flex; align-items: center; padding: 0 5%;
            background-size: cover; background-position: center; transition: 0.8s;
        }
        .hero::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to right, #000, transparent), linear-gradient(to top, var(--bg), transparent);
        }
        .hero-content { position: relative; z-index: 10; max-width: 600px; }
        .hero-content h1 { font-size: 55px; font-weight: 800; margin-bottom: 15px; }
        .hero-content p { color: var(--text-dim); margin-bottom: 25px; font-size: 18px; }
        .btn-play {
            background: var(--accent); color: white; padding: 12px 35px; border: none;
            border-radius: 5px; font-weight: 700; cursor: pointer; font-size: 18px; transition: 0.3s;
        }
        .btn-play:hover { background: white; color: black; transform: scale(1.05); }

        /* --- MOVIE GRID --- */
        .main-container { padding: 40px 5%; }
        .section-title { font-size: 22px; font-weight: 600; margin-bottom: 20px; border-left: 4px solid var(--accent); padding-left: 15px; }
        .movie-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px; margin-bottom: 50px;
        }
        .movie-card {
            background: var(--card-bg); border-radius: 10px; overflow: hidden;
            transition: 0.4s; cursor: pointer; position: relative;
        }
        .movie-card:hover { transform: scale(1.05); z-index: 5; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .movie-card .info { padding: 10px; text-align: center; }
        .movie-card h4 { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* --- PLAYER MODAL --- */
        .player-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            display: none; justify-content: center; align-items: center; z-index: 2000;
        }
        .player-container { width: 90%; max-width: 900px; position: relative; }
        .close-player {
            position: absolute; top: -45px; right: 0; color: white;
            font-size: 30px; cursor: pointer;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            .hero-content h1 { font-size: 35px; }
            .search-box input { width: 120px; }
            .movie-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
        }
    </style>
</head>
<body>

    <nav id="navbar">
        <div class="logo">STREAM PRO</div>
        <div class="search-box">
            <i class="fa fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search movies..." oninput="searchMovies()">
        </div>
    </nav>

    <section class="hero" id="hero">
        <div class="hero-content">
            <h1 id="heroTitle">Loading...</h1>
            <p id="heroDesc">The best selection of movies and series at your fingertips.</p>
            <button class="btn-play" id="heroPlayBtn"><i class="fa fa-play"></i> &nbsp; Play Now</button>
        </div>
    </section>

    <div class="main-container">
        <div id="moviesArea"></div>
    </div>

    <!-- VIDEO PLAYER MODAL -->
    <div class="player-modal" id="playerModal">
        <div class="player-container">
            <span class="close-player" onclick="closePlayer()">&times;</span>
            <video id="my-video" class="video-js vjs-theme-city vjs-big-play-centered" controls preload="auto" width="900" height="500"></video>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
        let allMovies = [];
        const moviesArea = document.getElementById('moviesArea');
        const player = videojs('my-video');

        // 1. Fetch Movies Data
        // Yahan aap apna npoint JSON link dalein
        const JSON_URL = "https://api.npoint.io/56fc751c2191cd12b672"; 

        fetch(JSON_URL)
            .then(res => res.json())
            .then(data => {
                allMovies = data;
                renderHero(allMovies[0]);
                renderGrid(allMovies);
            });

        // 2. Render Hero Section
        function renderHero(movie) {
            if(!movie) return;
            document.getElementById('hero').style.backgroundImage = `url('${movie.logo}')`;
            document.getElementById('heroTitle').innerText = movie.name;
            document.getElementById('heroPlayBtn').onclick = () => openPlayer(movie.url);
        }

        // 3. Render Movie Grid
        function renderGrid(data) {
            moviesArea.innerHTML = "";
            const categories = {};
            data.forEach(m => {
                if(!categories[m.cat]) categories[m.cat] = [];
                categories[m.cat].push(m);
            });

            for(let cat in categories) {
                let html = `<div class="section-title">${cat}</div><div class="movie-grid">`;
                categories[cat].forEach(m => {
                    html += `
                        <div class="movie-card" onclick="openPlayer('${m.url}')">
                            <img src="${m.logo}" alt="${m.name}">
                            <div class="info">
                                <h4>${m.name}</h4>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
                moviesArea.innerHTML += html;
            }
        }

        // 4. Search Function
        function searchMovies() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allMovies.filter(m => m.name.toLowerCase().includes(term));
            renderGrid(filtered);
        }

        // 5. Player Logic (M3U8 Support)
        function openPlayer(url) {
            document.getElementById('playerModal').style.display = 'flex';
            player.src({
                src: url,
                type: url.includes('.mpd') ? 'application/dash+xml' : 'application/x-mpegURL'
            });
            player.play();
        }

        function closePlayer() {
            player.pause();
            document.getElementById('playerModal').style.display = 'none';
        }

        // Navbar scroll effect
        window.onscroll = function() {
            if (window.scrollY > 50) navbar.classList.add('scrolled');
            else navbar.classList.remove('scrolled');
        };
    </script>
</body>
</html>
