<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREAMX | Premium Entertainment</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Video.js (Universal Player) -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1.0.1/dist/city/index.css" rel="stylesheet">

    <style>
        :root {
            --bg: #050505;
            --nav-bg: rgba(5, 5, 5, 0.8);
            --card-bg: #121212;
            --text: #ffffff;
            --text-dim: #b3b3b3;
            --accent: #E50914;
            --border: rgba(255, 255, 255, 0.1);
        }

        [data-theme="light"] {
            --bg: #f5f5f7;
            --nav-bg: rgba(245, 245, 247, 0.8);
            --card-bg: #ffffff;
            --text: #1d1d1f;
            --text-dim: #6e6e73;
            --accent: #E50914;
            --border: rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; transition: 0.3s ease; }
        body { background-color: var(--bg); color: var(--text); overflow-x: hidden; }

        /* --- NAVIGATION --- */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%; background: var(--nav-bg);
            backdrop-filter: blur(20px); position: fixed; width: 100%; top: 0; z-index: 1000;
            border-bottom: 1px solid var(--border);
        }
        .nav-left { display: flex; align-items: center; gap: 20px; }
        .hamburger { font-size: 24px; cursor: pointer; color: var(--text); }
        
        /* STREAMX LOGO */
        .logo { font-size: 32px; font-weight: 900; letter-spacing: -1.5px; cursor: pointer; text-transform: uppercase; }
        .logo span.red { color: var(--accent); }
        .logo span.white { color: var(--text); }

        .nav-right { display: flex; align-items: center; gap: 15px; }
        .search-box {
            background: var(--bg); border: 1px solid var(--border);
            padding: 8px 15px; border-radius: 20px; display: flex; align-items: center;
        }
        .search-box input { background: transparent; border: none; color: var(--text); outline: none; margin-left: 10px; width: 180px; }
        
        .theme-btn { font-size: 20px; cursor: pointer; color: var(--text); background: none; border: none; }

        /* --- SIDEBAR (HAMBURGER) --- */
        .sidebar {
            position: fixed; top: 0; left: -320px; width: 300px; height: 100%;
            background: var(--bg); z-index: 2000; border-right: 1px solid var(--border);
            padding: 40px 25px; box-shadow: 20px 0 50px rgba(0,0,0,0.5);
        }
        .sidebar.open { left: 0; }
        .sidebar-close { position: absolute; top: 20px; right: 20px; font-size: 25px; cursor: pointer; }
        .sidebar h2 { margin-bottom: 20px; color: var(--accent); }
        .sidebar-info { margin-top: 30px; }
        .sidebar-info p { margin-bottom: 10px; font-size: 15px; color: var(--text-dim); }
        .sidebar-info b { color: var(--text); }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1500; display: none; }

        /* --- HERO SLIDESHOW --- */
        .hero {
            height: 85vh; width: 100%; position: relative; display: flex; 
            align-items: flex-end; padding: 0 5% 80px; background-size: cover; background-position: center;
        }
        /* Lighter Tint Overlay */
        .hero::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to top, var(--bg) 5%, transparent 60%);
        }
        .hero-content { position: relative; z-index: 10; max-width: 800px; text-align: left; }
        .hero-content h1 { font-size: clamp(35px, 8vw, 70px); font-weight: 900; line-height: 1; margin-bottom: 10px; }
        .hero-content p { color: var(--text-dim); margin-bottom: 25px; font-size: 18px; max-width: 500px; }
        
        .btn-play {
            background: var(--accent); color: white; padding: 14px 40px; border: none;
            border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 18px;
            display: inline-flex; align-items: center; gap: 10px;
        }
        .btn-play:hover { transform: scale(1.05); background: #ff1e2b; }

        /* --- GRID --- */
        .container { padding: 40px 5%; }
        .section-title { font-size: 24px; font-weight: 800; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
        .section-title::before { content: ''; width: 5px; height: 25px; background: var(--accent); border-radius: 10px; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .movie-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; cursor: pointer; border: 1px solid var(--border); }
        .movie-card:hover { transform: translateY(-10px); border-color: var(--accent); }
        .movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .movie-card h4 { padding: 10px; font-size: 14px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* --- PLAYER MODAL --- */
        .player-modal {
            position: fixed; inset: 0; background: #000;
            display: none; justify-content: center; align-items: center; z-index: 3000;
        }
        .player-container { width: 100%; height: 100%; position: relative; }
        .close-player {
            position: absolute; top: 20px; right: 20px; color: white;
            font-size: 40px; cursor: pointer; z-index: 3100;
        }

        @media (max-width: 768px) {
            .search-box { display: none; }
            .hero-content h1 { font-size: 40px; }
            .movie-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <span class="sidebar-close" onclick="toggleSidebar()">&times;</span>
        <div class="logo"><span class="red">STREAM</span><span class="white">X</span></div>
        <div class="sidebar-info">
            <h2>About</h2>
            <p><b>Developed by:</b> yash</p>
            <p><b>Version:</b> 2.0 Platinum</p>
            <p><b>Support:</b> yash@streamx.com</p>
            <hr style="opacity: 0.1; margin: 20px 0;">
            <p>Watch unlimited Movies and Series with our high-speed engine.</p>
            <p><i class="fa fa-bolt"></i> Zero Buffering</p>
            <p><i class="fa fa-shield-halved"></i> DRM Protected</p>
        </div>
    </div>

    <!-- NAVBAR -->
    <nav id="navbar">
        <div class="nav-left">
            <i class="fa fa-bars hamburger" onclick="toggleSidebar()"></i>
            <div class="logo" onclick="location.reload()">
                <span class="red">STREAM</span><span class="white">X</span>
            </div>
        </div>
        <div class="nav-right">
            <div class="search-box">
                <i class="fa fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search..." oninput="searchMovies()">
            </div>
            <button class="theme-btn" id="themeToggle" onclick="toggleTheme()">
                <i class="fa fa-moon"></i>
            </button>
        </div>
    </nav>

    <!-- HERO SLIDESHOW -->
    <section class="hero" id="hero">
        <div class="hero-content" id="heroContent">
            <h1 id="heroTitle">Loading Store...</h1>
            <button class="btn-play" id="heroPlayBtn"><i class="fa fa-play"></i> Watch Now</button>
        </div>
    </section>

    <div class="container">
        <div id="moviesArea"></div>
    </div>

    <!-- UNIVERSAL VIDEO PLAYER -->
    <div class="player-modal" id="playerModal">
        <div class="player-container">
            <span class="close-player" onclick="closePlayer()">&times;</span>
            <video id="v-player" class="video-js vjs-theme-city vjs-big-play-centered" controls preload="auto" style="width: 100%; height: 100vh;"></video>
        </div>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
        let allMovies = [], heroItems = [], gridItems = [], currentSlide = 0;
        const vPlayer = videojs('v-player', {
            playbackRates: [0.5, 1, 1.5, 2],
            responsive: true,
            fluid: true
        });

        // 1. Fetch & Initialize
        const JSON_URL = "https://api.npoint.io/56fc751c2191cd12b672"; 

        async function init() {
            try {
                const res = await fetch(JSON_URL);
                allMovies = await res.json();
                
                heroItems = allMovies.filter(m => !m.cat || m.cat === "");
                gridItems = allMovies.filter(m => m.cat && m.cat !== "");

                startHeroSlideshow();
                renderGrid(gridItems);
            } catch (e) { console.error("Error loading JSON"); }
        }

        // 2. Hero Slideshow
        function startHeroSlideshow() {
            if(heroItems.length === 0) return;
            updateHero(heroItems[0]);
            setInterval(() => {
                currentSlide = (currentSlide + 1) % heroItems.length;
                updateHero(heroItems[currentSlide]);
            }, 7000);
        }

        function updateHero(m) {
            const hero = document.getElementById('hero');
            const content = document.getElementById('heroContent');
            content.style.opacity = 0;
            setTimeout(() => {
                hero.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url('${m.logo}')`;
                document.getElementById('heroTitle').innerText = m.name;
                document.getElementById('heroPlayBtn').onclick = () => openPlayer(m.url);
                content.style.opacity = 1;
            }, 500);
        }

        // 3. Render Grid
        function renderGrid(data) {
            const area = document.getElementById('moviesArea');
            area.innerHTML = "";
            const cats = {};
            data.forEach(m => { if(!cats[m.cat]) cats[m.cat]=[]; cats[m.cat].push(m); });

            for(let cat in cats) {
                let html = `<div class="section-title">${cat}</div><div class="movie-grid">`;
                cats[cat].forEach(m => {
                    html += `
                        <div class="movie-card" onclick="openPlayer('${m.url}')">
                            <img src="${m.logo}" loading="lazy">
                            <h4>${m.name}</h4>
                        </div>`;
                });
                html += `</div>`;
                area.innerHTML += html;
            }
        }

        // 4. Navigation & UI Functions
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').style.display = 
                document.getElementById('sidebar').classList.contains('open') ? 'block' : 'none';
        }

        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            document.getElementById('themeToggle').innerHTML = isDark ? '<i class="fa fa-sun"></i>' : '<i class="fa fa-moon"></i>';
        }

        function searchMovies() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filt = gridItems.filter(m => m.name.toLowerCase().includes(term));
            renderGrid(filt);
        }

        // 5. Universal Player Logic
        function openPlayer(url) {
            document.getElementById('playerModal').style.display = 'flex';
            let type = 'application/x-mpegURL'; // Default HLS
            if(url.includes('.mp4')) type = 'video/mp4';
            if(url.includes('.mpd')) type = 'application/dash+xml';

            vPlayer.src({ src: url, type: type });
            vPlayer.play();
        }

        function closePlayer() {
            vPlayer.pause();
            document.getElementById('playerModal').style.display = 'none';
        }

        window.onscroll = () => {
            const nav = document.getElementById('navbar');
            if (window.scrollY > 50) nav.style.padding = "10px 5% shadow: 0 5px 20px rgba(0,0,0,0.5)";
        };

        init();
    </script>
</body>
</html>
