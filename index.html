<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Video.js -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1.0.1/dist/city/index.css" rel="stylesheet">

    <style>
        :root {
            --bg: #050505;
            --card-bg: #121212;
            --accent: #E50914; 
            --text: #ffffff;
            --text-dim: #b3b3b3;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg); color: var(--text); overflow-x: hidden; }

        /* --- NAVBAR --- */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            position: fixed; width: 100%; top: 0; z-index: 1000; transition: 0.4s;
        }
        nav.scrolled { background: #000; border-bottom: 1px solid #222; padding: 10px 5%; }
        .logo { font-size: 28px; font-weight: 800; color: var(--accent); letter-spacing: -1px; }
        .search-box {
            background: rgba(255,255,255,0.1); border: 1px solid #333;
            padding: 8px 15px; border-radius: 20px; display: flex; align-items: center;
        }
        .search-box input {
            background: transparent; border: none; color: white; outline: none; margin-left: 10px; width: 200px;
        }

        /* --- HERO SLIDESHOW --- */
        .hero {
            height: 85vh; width: 100%; position: relative; display: flex; align-items: center; 
            padding: 0 5%; background-size: cover; background-position: center;
            transition: background-image 0.8s ease-in-out;
        }
        .hero::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to right, #000 10%, transparent 90%), 
                        linear-gradient(to top, var(--bg) 5%, transparent 50%);
        }
        .hero-content { position: relative; z-index: 10; max-width: 650px; }
        .hero-content h1 { font-size: clamp(30px, 8vw, 60px); font-weight: 800; margin-bottom: 15px; transition: 0.5s; }
        .hero-content p { color: var(--text-dim); margin-bottom: 25px; font-size: 18px; }
        
        .btn-play {
            background: var(--accent); color: white; padding: 12px 35px; border: none;
            border-radius: 5px; font-weight: 700; cursor: pointer; font-size: 18px; transition: 0.3s;
            display: inline-flex; align-items: center; gap: 10px;
        }
        .btn-play:hover { background: white; color: black; transform: scale(1.05); }

        .slider-dots {
            position: absolute; bottom: 30px; left: 5%; display: flex; gap: 10px; z-index: 20;
        }
        .dot { 
            width: 10px; height: 10px; background: rgba(255,255,255,0.3); 
            border-radius: 50%; cursor: pointer; transition: 0.3s;
        }
        .dot.active { background: var(--accent); width: 30px; border-radius: 5px; }

        /* --- MOVIE GRID --- */
        .main-container { padding: 40px 5%; position: relative; z-index: 50; margin-top: -50px; }
        .section-title { font-size: 24px; font-weight: 700; margin-bottom: 20px; color: var(--text); display: flex; align-items: center; gap: 10px; }
        .section-title::before { content: ''; width: 4px; height: 24px; background: var(--accent); border-radius: 2px; }
        
        .movie-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px; margin-bottom: 50px;
        }
        .movie-card {
            background: var(--card-bg); border-radius: 12px; overflow: hidden;
            transition: 0.4s; cursor: pointer; border: 1px solid #1a1a1a;
        }
        .movie-card:hover { transform: translateY(-10px); border-color: var(--accent); box-shadow: 0 10px 20px rgba(229, 9, 20, 0.2); }
        .movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .movie-card .info { padding: 12px; text-align: left; }
        .movie-card h4 { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }

        /* --- PLAYER MODAL --- */
        .player-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.98);
            display: none; justify-content: center; align-items: center; z-index: 2000;
        }
        .player-container { width: 95%; max-width: 1000px; position: relative; }
        .close-player {
            position: absolute; top: -50px; right: 0; color: white;
            font-size: 40px; cursor: pointer; line-height: 1;
        }

        @media (max-width: 768px) {
            .hero { height: 60vh; }
            .hero-content h1 { font-size: 35px; }
            .movie-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
        }
    </style>
</head>
<body>

    <nav id="navbar">
        <div class="logo">StreamX</div>
        <div class="search-box">
            <i class="fa fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search titles..." oninput="searchMovies()">
        </div>
    </nav>

    <section class="hero" id="hero">
        <div class="hero-content" id="heroContent">
            <h1 id="heroTitle">Loading Store...</h1>
            <p id="heroDesc">Watch premium content with zero buffering.</p>
            <button class="btn-play" id="heroPlayBtn"><i class="fa fa-play"></i> Play Now</button>
        </div>
        <div class="slider-dots" id="sliderDots"></div>
    </section>

    <div class="main-container">
        <div id="moviesArea"></div>
    </div>

    <!-- PLAYER MODAL -->
    <div class="player-modal" id="playerModal">
        <div class="player-container">
            <span class="close-player" onclick="closePlayer()">&times;</span>
            <video id="my-video" class="video-js vjs-theme-city vjs-big-play-centered" controls preload="auto" width="1000" height="560"></video>
        </div>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
        let allData = [];
        let heroMovies = [];
        let gridMovies = [];
        let currentSlide = 0;
        const player = videojs('my-video');

        // npoint JSON URL
        const JSON_URL = "https://api.npoint.io/56fc751c2191cd12b672"; 

        async function init() {
            try {
                const res = await fetch(JSON_URL);
                allData = await res.json();
                
                // Logic: Separate Hero (No cat) and Grid (With cat)
                heroMovies = allData.filter(m => !m.cat || m.cat.trim() === "");
                gridMovies = allData.filter(m => m.cat && m.cat.trim() !== "");

                if(heroMovies.length > 0) {
                    startSlideshow();
                } else {
                    // Fallback if no hero items
                    document.getElementById('hero').style.display = "none";
                }

                renderGrid(gridMovies);
            } catch (e) {
                console.error("Failed to load data");
            }
        }

        // --- SLIDESHOW LOGIC ---
        function startSlideshow() {
            renderDots();
            updateHero(heroMovies[0]);
            
            setInterval(() => {
                currentSlide = (currentSlide + 1) % heroMovies.length;
                updateHero(heroMovies[currentSlide]);
            }, 6000); // 6 Seconds auto-change
        }

        function updateHero(movie) {
            const hero = document.getElementById('hero');
            const hContent = document.getElementById('heroContent');
            
            hContent.style.opacity = 0;
            setTimeout(() => {
                hero.style.backgroundImage = `url('${movie.logo}')`;
                document.getElementById('heroTitle').innerText = movie.name;
                document.getElementById('heroPlayBtn').onclick = () => openPlayer(movie.url);
                updateDots();
                hContent.style.opacity = 1;
            }, 500);
        }

        function renderDots() {
            const container = document.getElementById('sliderDots');
            container.innerHTML = heroMovies.map((_, i) => `<div class="dot" onclick="manualSlide(${i})"></div>`).join('');
            updateDots();
        }

        function updateDots() {
            const dots = document.querySelectorAll('.dot');
            dots.forEach((d, i) => d.className = i === currentSlide ? 'dot active' : 'dot');
        }

        function manualSlide(i) {
            currentSlide = i;
            updateHero(heroMovies[i]);
        }

        // --- GRID LOGIC ---
        function renderGrid(data) {
            const area = document.getElementById('moviesArea');
            area.innerHTML = "";
            const categories = {};
            
            data.forEach(m => {
                if(!categories[m.cat]) categories[m.cat] = [];
                categories[m.cat].push(m);
            });

            for(let cat in categories) {
                let html = `<div class="section-title">${cat}</div><div class="movie-grid">`;
                categories[cat].forEach(m => {
                    html += `
                        <div class="movie-card" onclick="openPlayer('${m.url}')">
                            <img src="${m.logo}" alt="${m.name}" loading="lazy">
                            <div class="info">
                                <h4>${m.name}</h4>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
                area.innerHTML += html;
            }
        }

        function searchMovies() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = gridMovies.filter(m => m.name.toLowerCase().includes(term));
            renderGrid(filtered);
        }

        function openPlayer(url) {
            document.getElementById('playerModal').style.display = 'flex';
            player.src({ src: url, type: 'application/x-mpegURL' });
            player.play();
        }

        function closePlayer() {
            player.pause();
            document.getElementById('playerModal').style.display = 'none';
        }

        window.onscroll = () => {
            const nav = document.getElementById('navbar');
            if (window.scrollY > 100) nav.classList.add('scrolled');
            else nav.classList.remove('scrolled');
        };

        init();
    </script>
</body>
</html>
